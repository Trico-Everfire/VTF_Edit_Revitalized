        </text>
        <text x="355" y="140" transform="scale(.1)" fill="#fff" textLength="250">ko-fi</text>
        <text aria-hidden="true" x="745" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)"
              textLength="370">donate
        </text>
        <text x="745" y="140" transform="scale(.1)" fill="#fff" textLength="370">donate</text>
    </g>
